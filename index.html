<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Библиотека промптов — LAVRI LOOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#eef1f2;
    --bg-2:#f6f3ee;
    --ink:#2a2b28;
    --ink-soft:#5b5c58;
    --line:#d9d6cd;
    --card:#fffdfa;
    --accent:#b5584a;
    --accent-soft:#e7d9d3;
    --tag-bg:#eee9df;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #f3eee5 0%, transparent 60%),
      radial-gradient(1000px 700px at 100% 0%, #e5ebee 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:56px 20px 90px;
  }

  header.hero{margin-bottom:44px;}
  .eyebrow{
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--accent);
    font-weight:600;
    margin:0 0 14px;
    cursor:pointer;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:44px;
    line-height:1.08;
    letter-spacing:-0.01em;
    margin:0 0 18px;
    color:var(--ink);
  }
  .hero-desc{
    font-size:16px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:56ch;
    margin:0;
  }
  .hero-desc-second{
    margin-top:12px;
  }
  .hero-highlight{
    color:var(--accent);
    font-weight:700;
  }
  .cat-nav{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:28px;
  }
  .cat-pill{
    font-size:13px;
    padding:8px 14px;
    border-radius:100px;
    background:var(--tag-bg);
    color:var(--ink-soft);
    border:1px solid var(--line);
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .cat-pill:hover{border-color:var(--accent);color:var(--ink);}
  .cat-nav-break{flex-basis:100%;height:0;}
  .cat-pill.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fdf6f3;
  }

  section.category{margin-top:52px;}
  .cat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:20px;
  }
  section.category h2{
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-style:italic;
    font-size:26px;
    margin:0;
    color:var(--ink);
  }
  .scroll-top-btn{
    flex-shrink:0;
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--tag-bg);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .scroll-top-btn svg{width:15px;height:15px;}
  .scroll-top-btn:hover{background:var(--accent-soft);border-color:var(--accent);}

  .entry{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:14px;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(30,25,15,0.03);
    transition:border-color .15s ease, transform .1s ease;
  }
  .tap-badge{
    position:absolute;
    top:20px;
    right:14px;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--card);
    border:1.2px solid rgba(181,88,74,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 1px 2px rgba(30,25,15,0.05);
    pointer-events:none;
  }
  .tap-badge svg{
    width:14px;
    height:14px;
    color:rgba(181,88,74,0.4);
    fill:currentColor;
  }
  .entry:hover{border-color:var(--accent);}
  .entry:active{transform:scale(0.995);}
  .entry-left{min-width:0;padding-right:36px;}
  .entry-tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 9px;
    border-radius:100px;
    margin-bottom:9px;
    font-weight:600;
  }
  .entry h3{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 6px;
    line-height:1.25;
  }
  .entry p{
    font-size:14px;
    line-height:1.5;
    color:var(--ink-soft);
    margin:0;
    max-width:52ch;
  }
  .entry-arrow{
    flex-shrink:0;
    font-family:'Playfair Display', serif;
    font-size:22px;
    color:var(--accent);
  }

  footer.page-footer{
    margin-top:60px;
    padding-top:24px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
  }
  footer.page-footer .disclaimer{
    display:block;
    max-width:56ch;
    margin:0 auto 14px;
    font-size:12px;
    line-height:1.6;
    color:var(--ink-soft);
    opacity:0.85;
  }

  .breadcrumb{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:36px;
  }
  .breadcrumb span.crumb{
    display:inline-flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    color:var(--accent);
    font-weight:600;
    border:1px solid var(--accent);
    border-radius:100px;
    padding:5px 12px;
    transition:background .15s ease, color .15s ease;
  }
  .breadcrumb span.crumb svg{width:11px;height:11px;flex-shrink:0;}
  .breadcrumb span.crumb:hover{background:var(--accent);color:#fdf6f3;}
  .breadcrumb .sep{color:var(--line);}

  .single-tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--accent);
    background:var(--accent-soft);
    padding:4px 10px;
    border-radius:100px;
    margin-bottom:14px;
    font-weight:600;
  }
  .single-title{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:36px;
    line-height:1.12;
    margin:0 0 14px;
  }
  .single-blurb{
    font-size:16px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:60ch;
    margin:0 0 28px;
  }

  .attach-note{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    border-radius:12px;
    padding:14px 16px;
    margin:0 0 24px;
    max-width:60ch;
  }
  .attach-note .icon{
    color:var(--accent);
    font-size:16px;
    line-height:1.5;
    flex-shrink:0;
  }
  .attach-note p{
    margin:0;
    font-size:14px;
    line-height:1.55;
    color:var(--accent);
    font-weight:600;
  }

  .single-actions{
    display:flex;
    gap:10px;
    margin-bottom:28px;
  }
  button.btn{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:11px 18px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .05s ease;
  }
  button.btn:hover{border-color:var(--accent);}
  button.btn:active{transform:scale(0.98);}
  button.btn.primary{
    background:var(--ink);
    border-color:var(--ink);
    color:#fdf9f2;
  }
  button.btn.primary:hover{background:var(--accent);border-color:var(--accent);}
  button.btn.copied{
    background:var(--accent);
    border-color:var(--accent);
    color:#fdf6f3;
  }

  .single-body{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 26px;
    font-size:15px;
    line-height:1.7;
    color:var(--ink);
    white-space:pre-wrap;
    font-family:'Inter',sans-serif;
    box-shadow:0 1px 2px rgba(30,25,15,0.03);
    position:relative;
    overflow:hidden;
  }
  .single-body.collapsed{
    max-height:220px;
  }
  .single-body.collapsed::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:0;
    height:90px;
    background:linear-gradient(180deg, transparent, var(--card) 85%);
    pointer-events:none;
  }
  .toggle-body-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    background:var(--card-2, var(--tag-bg));
    border:1px solid var(--line);
    border-top:none;
    border-radius:0 0 14px 14px;
    margin-top:-14px;
    padding:12px;
    font-size:13.5px;
    font-weight:600;
    color:var(--accent);
    cursor:pointer;
    position:relative;
    z-index:1;
  }
  .toggle-body-btn svg{width:13px;height:13px;transition:transform .2s ease;}
  .toggle-body-btn.expanded svg{transform:rotate(180deg);}

  .single-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:36px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .single-nav .nav-btn{
    font-family:'Playfair Display', serif;
    font-size:15px;
    color:var(--ink-soft);
    cursor:pointer;
    background:none;
    border:none;
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px;
  }
  .single-nav .nav-btn:hover{color:var(--accent);}
  .single-nav .nav-btn.disabled{
    visibility:hidden;
  }
  .single-nav .counter{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  @media (max-width:480px){
    h1{font-size:34px;}
    .single-title{font-size:26px;margin-bottom:8px;}
    .wrap{padding:52px 16px 70px;}
    .entry{padding:16px 18px;flex-direction:column;align-items:flex-start;}
    .entry-arrow{display:none;}
    .single-body{padding:16px 16px;}
    .breadcrumb{margin-bottom:18px;}
    .single-tag{margin-bottom:8px;}
    .single-blurb{margin-bottom:16px;font-size:14.5px;}
    .attach-note{margin-bottom:16px;padding:12px 14px;}
    .single-actions{margin-bottom:16px;}
    .single-body.collapsed{max-height:130px;}
    .single-body.collapsed::after{height:60px;}
    .toggle-body-btn{padding:9px;font-size:13px;}
    .single-nav{margin-top:20px;padding-top:14px;}
  }
</style>
</head>

ели конкурента", "blurb": "Переписывает карусель конкурента под твой блог — тот же смысл, полностью другие слова, без плагиата.", "tag": "", "attach": "Вставь этот промпт в нейросеть и загрузи текст карусели конкурента, которую нужно адаптировать."}, {"id": "p14", "cat": "carousels", "title": "Карусель из сырого материала", "blurb": "Превращает голосовое или текст от подписчика в готовую вирусную карусель — с анализом боли и самопроверкой по 10 пунктам.", "tag": "", "attach": "Вставь этот промпт в нейросеть и загрузи голосовое сообщение или текст с реальной ситуацией/болью подписчика."}, {"id": "p16", "cat": "carousels", "title": "Банк заголовков для каруселей", "blurb": "Не просто список формул: разбирает твою нишу и аудиторию и выдаёт 8–10 готовых заголовков именно под твою тему.", "tag": ""}, {"id": "p4", "cat": "reels", "title": "Вирусные Reels (охваты + подписка)", "blurb": "Генерирует 10 идей роликов с хуком, сценарием и форматом под охваты и подписку — под съёмку на телефон.", "tag": ""}, {"id": "p20", "cat": "reels", "title": "Поиск залетающих тем в любой нише", "blurb": "Находит 15 триггерных тем под зумерскую аудиторию по 5 проверенным категориям вовлечения — с готовым хуком, психологическим триггером и уровнем риска под каждую.", "tag": ""}, {"id": "p15", "cat": "reels", "title": "Подбор формата для Reels", "blurb": "Анализирует профиль и задаёт вопросы по одному, чтобы подобрать 4 формата, которые реально подойдут именно тебе.", "tag": "", "attach": "Вставь этот промпт в нейросеть и загрузи скриншот своего профиля Instagram."}, {"id": "p8", "cat": "reels", "title": "Написание сильного сценария", "blurb": "Собирает один сильный сценарий Reels целиком: от хука до причины, почему это может залететь.", "tag": ""}, {"id": "p10", "cat": "reels", "title": "Создание ключевых слов", "blurb": "Подбирает 15 SEO-слов под тему ролика — для скрытого текста, alt-текста и описания поста.", "tag": "SEO"}, {"id": "p17", "cat": "reels", "title": "Банк заголовков для Reels", "blurb": "Разбирает твою нишу и аудиторию и подбирает из 100 формул готовые заголовки под конкретный Reels.", "tag": ""}, {"id": "p19", "cat": "carousels", "title": "Мастер-промпт для текста карусели (GPT / Claude)", "blurb": "Работает как живое интервью: нейросеть сама расспрашивает про нишу и тему, ведёт через анализ, структуру по слайдам и самопроверку вовлечения — и в конце спрашивает, собирать ли визуал сразу. Работает и в GPT чате, и в Claude.", "tag": "Мега-промпт", "attach": "Вставь этот промпт в новый чат (ChatGPT или Claude) как есть, ничего заранее не заполняя — нейросеть сама спросит про нишу и тему и проведёт весь процесс интервью. Отвечай на вопросы по одному и веди процесс в одном диалоге до конца."}, {"id": "p22", "cat": "packaging", "title": "Визуальный код Instagram", "blurb": "Пять промптов подряд собирают узнаваемый аккаунт: код ленты, обложка-хук, контентные опоры, главная мысль страницы и итоговый визуальный паспорт.", "tag": "Мега-промпт", "attach": "Промпты идут строго по порядку — вставляй по одному, результат каждого подставляй в следующий вместо соответствующего поля в квадратных скобках. Не пропускай порядок."}, {"id": "p23", "cat": "packaging", "title": "Шрифтовая пара и палитра бренда", "blurb": "Сначала уточняет, есть ли у бренда своя библиотека шрифтов или примеры — и подбирает пару из них; если нет, предлагает подборку шрифтов или использует фиксированный набор LAVRI LOOK. Плюс цветовая палитра с HEX-кодами.", "tag": "", "attach": "Вставь этот промпт в нейросеть. Сначала она спросит, есть ли у бренда своя библиотека шрифтов — если да, приложи её; если нет, она предложит ссылку на подборку шрифтов или попросит прислать скриншоты понравившихся примеров. Дальше просто отвечай на вопросы интервью по одному."}, {"id": "p30", "cat": "photosessions", "title": "От готового фото до редактируемого слоя в Canva", "blurb": "Когда содержание инфографики уже утверждено — собирает из готового фото и текста редактируемый макет в Canva: фон и отдельные текстовые слои, а не вплавленная в кадр надпись.", "tag": "", "attach": "Убедись, что подключено приложение Canva (в ChatGPT) или коннектор Canva (в Claude). Вставь этот промпт вместе с готовым содержанием инфографики из промпта «От готового фото до инфографики»."}, {"id": "p29", "cat": "photosessions", "title": "От готового фото до инфографики", "blurb": "Анализирует уже готовое фото товара и предлагает содержание инфографики — заголовок с УТП, акцентные подписи, CTA — без пересъёмки и без прохождения полной нейрофотосессии заново.", "tag": "", "attach": "Вставь этот промпт в нейросеть и загрузи готовое фото товара — то, что уже отснято и обработано и не требует пересъёмки. Готовое содержание инфографики дальше можно передать в промпт «От готового фото до редактируемого слоя в Canva»."}, {"id": "p24", "cat": "photosessions", "title": "AI-фотосессия товара: от фото до Canva", "blurb": "Ведёт пошагово от исходных фото товара до готовой коммерческой нейрофотосессии, инфографики и макета в Canva — с сохранением конструкции, модели и стиля на каждом этапе.", "tag": "Мега-промпт", "attach": "Вставь этот промпт в нейросеть и жди, когда она попросит фото товара — дальше отвечай на каждом этапе, не пропуская подтверждений."}, {"id": "p27", "cat": "photosessions", "title": "Студийная раскадровка на белом фоне (12 кадров)", "blurb": "Собирает контактный лист из 12 кадров товара в светлой студии на белом фоне — фронтальные и боковые ракурсы, спина и крупные планы реальных конструктивных деталей.", "tag": "", "attach": "Вставь этот промпт в нейросеть и загрузи референсное фото товара или образа целиком — конструкция, цвет и материалы должны точно повториться во всех 12 кадрах."}, {"id": "p25", "cat": "photosessions", "title": "Художественная раскадровка по референсу", "blurb": "По одному референсному фото собирает цельную раскадровку — гибко подстраивается под человека в кадре или под товар: свободные художественные ракурсы или строгая контрольная сетка деталей.", "tag": "", "attach": "Вставь этот промпт в нейросеть и загрузи референсное фото — то, чей внешний вид, образ, товар и стиль должны точно повториться во всех кадрах раскадровки."}, {"id": "p26", "cat": "ai_video", "title": "Раскадровка кадра под видео-сцены", "blurb": "Если есть только один художественный кадр — превращает его в раскадровку из разных планов и ракурсов одного образа, чтобы дальше собрать по ним видео-сцены.", "tag": "", "attach": "Вставь этот промпт в нейросеть и загрузи референсное фото — художественный кадр, который нужно разложить на отдельные сцены для видео."}, {"id": "p28", "cat": "carousels", "title": "Запуск сборки карусели через коннекторы (Canva / Gamma)", "blurb": "Когда текст карусели уже готов — запускает автоматическую сборку визуала через подключённые инструменты: в ChatGPT через приложение Canva, в Claude — через MCP-коннекторы Canva или Gamma.", "tag": "", "attach": "Убедись, что подключён нужный инструмент (приложение Canva в ChatGPT или коннекторы Canva/Gamma в Claude). Вставь этот промпт вместе с готовым текстом карусели вместо [вставь сюда готовый текст карусели]."}], "bodies": {"p1": "IyDQoNCw0YHQv9Cw0LrQvtCy0LrQsCDRjdC60YHQv9C10YDRgtC90L7RgdGC0LgKCiMjINCg0L7Qu9GMINGB0LjRgdGC0LXQvNGLCgrQotGLIOKAlCBFeHBlcnQgTWV0aG9kb2xvZ3kgQXJjaGl0ZWN0LiDQotCy0L7RjyDRgdC/0LXRhtC40LDQu9C40LfQsNGG0LjRjyDigJQg0LjQt9Cy0LvQtdGH0Ywg0YMg0Y3QutGB0L/QtdGA0YLQsCDQtdCz0L4g0YDQtdCw0LvRjNC90YPRjiDQvNC10YLQvtC00L7Qu9C+0LPQuNGOINGA0LDQsdC+0YLRiywg0LXQs9C+INC/0YDQuNC90YbQuNC/0Ysg0Lgg0LDQvdGC0Lgt0L/RgNC40L3RhtC40L/Riywg0LXQs9C+INGD0L3QuNC60LDQu9GM0L3Ri9C1INC40L3RgdGC0YDRg9C80LXQvdGC0Ysg4oCUINC4INGD0L/QsNC60L7QstCw0YLRjCDQstGB0ZEg0Y3RgtC+INCyINGB0YLRgNGD0LrRgtGD0YDQuNGA0L7QstCw0L3QvdGL0Lkg0LDQstGC0L7RgNGB0LrQuNC5INC80LXRgtC+0LQg0YEg0L3QsNC30LLQsNC90LjQtdC8LCDRiNCw0LPQsNC80Lgg0Lgg0L7Qv9C40YHQsNC90LjQtdC8LiDQn9Cw0YDQsNC70LvQtdC70YzQvdC+INC30LDRhNC40LrRgdC40YDQvtCy0LDRgtGMINGC0LDQsdGDIOKAlCDRgtC+LCDRh9C10LPQviDRjdC60YHQv9C10YDRgiDQv9GA0LjQvdGG0LjQv9C40LDQu9GM0L3QviDQndCVINC00 function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const wrap = document.getElementById('wrap');
let activeCat = 'all';

function catName(catId){
  const c = DATA.categories.find(c => c.id === catId);
  return c ? c.name : '';
}

function renderIndex(){
  wrap.innerHTML = '';

  const header = document.createElement('header');
  header.className = 'hero';
  header.innerHTML = `
    <p class="eyebrow">LAVRI LOOK · Библиотека промптов</p>
    <h1>Библиотека промптов</h1>
    <p class="hero-desc">Готовые промпты для Claude и GPT под контент, стратегию и упаковку эксперта.</p>
    <p class="hero-desc hero-desc-second"><strong class="hero-highlight">Нажимай</strong> на нужный раздел — попадёшь на отдельную страницу с промптом целиком, кнопкой копирования и подробным описанием.</p>
  `;
  const nav = document.createElement('nav');
  nav.className = 'cat-nav';

  const allPill = document.createElement('button');
  allPill.className = 'cat-pill' + (activeCat === 'all' ? ' active' : '');
  allPill.textContent = 'Все';
  allPill.addEventListener('click', () => { activeCat = 'all'; renderIndex(); });
  nav.appendChild(allPill);

  DATA.categories.forEach(cat => {
    const pill = document.createElement('button');
    pill.className = 'cat-pill' + (activeCat === cat.id ? ' active' : '');
    pill.textContent = cat.name;
    pill.addEventListener('click', () => {
      activeCat = cat.id;
      renderIndex();
      const target = document.querySelector(`section.category[data-cat="${cat.id}"]`);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
    nav.appendChild(pill);
    if(cat.id === 'reels'){
      const breakEl = document.createElement('span');
      breakEl.className = 'cat-nav-break';
      nav.appendChild(breakEl);
    }
  });
  header.appendChild(nav);
  wrap.appendChild(header);

  const main = document.createElement('main');
  DATA.categories.forEach(cat => {
    if(activeCat !== 'all' && activeCat !== cat.id) return;
    const section = document.createElement('section');
    section.className = 'category';
    section.dataset.cat = cat.id;
    const catHeader = document.createElement('div');
    catHeader.className = 'cat-header';
    const h2 = document.createElement('h2');
    h2.textContent = cat.name;
    catHeader.appendChild(h2);
    const topBtn = document.createElement('button');
    topBtn.className = 'scroll-top-btn';
    topBtn.setAttribute('aria-label', 'Наверх');
    topBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/><path d="M6 9l6-6 6 6"/></svg>';

    catHeader.appendChild(topBtn);
    section.appendChild(catHeader);

    DATA.prompts.filter(p => p.cat === cat.id).forEach(p => {
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `
        <div class="tap-badge">
          <svg viewBox="0 0 24 24"><path d="M9,11.24V7.5C9,6.12 10.12,5 11.5,5S14,6.12 14,7.5v3.74c1.21,-0.81 2,-2.18 2,-3.74C16,5.01 13.99,3 11.5,3S7,5.01 7,7.5C7,9.06 7.79,10.43 9,11.24z"/><path d="M18.84,15.87l-4.54,-2.26c-0.17,-0.07 -0.35,-0.11 -0.54,-0.11H13v-6.5C13,6.4 12.1,5.5 11,5.5S9,6.4 9,7.5v10.74l-3.44,-0.72c-0.08,-0.02 -0.15,-0.03 -0.24,-0.03c-0.31,0 -0.59,0.13 -0.79,0.33l-0.79,0.8l4.94,4.94C9.09,23.94 9.5,24 10,24h6.62c0.75,0 1.33,-0.55 1.44,-1.28l0.75,-5.29c0.01,-0.06 0.01,-0.11 0.01,-0.17C18.82,16.6 18.84,16.22 18.84,15.87z"/></svg>

function renderSingle(id){
  const p = DATA.prompts.find(x => x.id === id);
  if(!p){ location.hash = ''; return; }

  const flatList = DATA.prompts;
  const idx = flatList.findIndex(x => x.id === id);
  const prev = idx > 0 ? flatList[idx-1] : null;
  const next = idx < flatList.length - 1 ? flatList[idx+1] : null;

  wrap.innerHTML = '';

  const crumb = document.createElement('div');
  crumb.className = 'breadcrumb';
  const arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
  crumb.innerHTML = '<span class="crumb crumb-home" data-nav="home">' + arrowSvg + 'Библиотека промптов</span><span class="sep">/</span><span class="crumb" data-nav="cat">' + arrowSvg + catName(p.cat) + '</span>';
  crumb.querySelectorAll('.crumb').forEach(el => {
    el.addEventListener('click', () => {
      if(el.dataset.nav === 'cat') activeCat = p.cat; else activeCat = 'all';
      location.hash = '';
    });
  });
  wrap.appendChild(crumb);

  if(p.tag){
    const tag = document.createElement('span');
    tag.className = 'single-tag';
    tag.textContent = p.tag;
    wrap.appendChild(tag);
  }

  const title = document.createElement('h1');
  title.className = 'single-title';
  title.textContent = p.title;
  wrap.appendChild(title);

  const blurb = document.createElement('p');
  blurb.className = 'single-blurb';
  blurb.textContent = p.blurb;
  wrap.appendChild(blurb);

  const rawBodyText = b64ToUtf8(DATA.bodies[p.id]);
  const instrMatch = rawBodyText.match(/^Инструкция:\s*\n([\s\S]*?)\n\nПромпт:\s*\n([\s\S]*)$/);
  const bodyText = instrMatch ? instrMatch[2] : rawBodyText;

  const noteText = p.attach || (instrMatch ? instrMatch[1].trim() : null);
  if(noteText){
    const note = document.createElement('div');
    note.className = 'attach-note';
    note.innerHTML = '<span class="icon">&rarr;</span><p>' + noteText + '</p>';
    wrap.appendChild(note);
  }

  const actions = document.createElement('div');
  actions.className = 'single-actions';
  const copyBtn = document.createElement('button');
  copyBtn.className = 'btn primary';
  copyBtn.textContent = 'Скопировать промпт';
  actions.appendChild(copyBtn);
  wrap.appendChild(actions);

  const body = document.createElement('div');
  body.className = 'single-body collapsed';
  body.textContent = bodyText;
  wrap.appendChild(body);

  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'toggle-body-btn';
  toggleBtn.innerHTML = 'Развернуть промпт <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  toggleBtn.addEventListener('click', () => {
    const isCollapsed = body.classList.toggle('collapsed');
    toggleBtn.classList.toggle('expanded', !isCollapsed);
    toggleBtn.innerHTML = (isCollapsed ? 'Развернуть промпт' : 'Свернуть промпт') + ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  });
  wrap.appendChild(toggleBtn);

  copyBtn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(bodyText);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = bodyText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Скопировано';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = original;
      copyBtn.classList.remove('copied');
    }, 1600);
  });

  const singleNav = document.createElement('div');
  singleNav.className = 'single-nav';

  const prevBtn = document.createElement('button');
  prevBtn.className = 'nav-btn' + (prev ? '' : ' disabled');
  prevBtn.innerHTML = '&larr; ' + (prev ? prev.title : '');
  if(prev) prevBtn.addEventListener('click', () => { location.hash = prev.id; });

  const counter = document.createElement('span');
  counter.className = 'counter';
  counter.textContent = (idx+1) + ' / ' + flatList.length;

  const nextBtn = document.createElement('button');
  nextBtn.className = 'nav-btn' + (next ? '' : ' disabled');
  nextBtn.innerHTML = (next ? next.title : '') + ' &rarr;';
  if(next) nextBtn.addEventListener('click', () => { location.hash = next.id; });

  singleNav.appendChild(prevBtn);
  singleNav.appendChild(counter);
  singleNav.appendChild(nextBtn);
  wrap.appendChild(singleNav);

  window.scrollTo(0,0);
}

function route(){
  const hash = location.hash.replace('#','');
  if(hash && DATA.prompts.some(p => p.id === hash)){
    renderSingle(hash);
  } else {
    renderIndex();
  }
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
